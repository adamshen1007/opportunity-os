services:
  - type: web
    name: opportunity-os-api
    runtime: node
    plan: starter
    branch: main
    buildCommand: corepack enable && corepack prepare pnpm@11.7.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @opportunity-os/api... build
    # Render stops release promotion when this command fails.
    preDeployCommand: pnpm --filter @opportunity-os/database migrate:deploy && pnpm --filter @opportunity-os/database migrate:status
    startCommand: pnpm --filter @opportunity-os/api start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: API_PERSISTENCE_MODE
        value: database
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: AUTH_SECRET_PEPPER
        sync: false
      - key: AUTH_INVITE_TTL_MS
        value: "604800000"
      - key: AUTH_SESSION_TTL_MS
        value: "28800000"
      - key: API_AUTH_REQUIRED
        value: "true"
      - key: API_ADMIN_ACCESS_TOKEN
        sync: false
      - key: API_LIVE_SCAN_ACCESS_TOKEN
        sync: false
      - key: OPERATIONS_ALERT_OPERATOR
        value: primary-beta-operator
      - key: OPPORTUNITY_OS_WEB_URL
        sync: false
      - key: OPPORTUNITY_OS_API_URL
        sync: false
      - key: STACK_EXCHANGE_LIVE_SCAN_ENABLED
        value: "true"
      - key: STACK_EXCHANGE_DEFAULT_SITE
        value: stackoverflow
      - key: STACK_EXCHANGE_API_KEY
        sync: false
      - key: LLM_LIVE_ANALYSIS_ENABLED
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
