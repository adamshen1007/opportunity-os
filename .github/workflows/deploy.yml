name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: external-mvp-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPLOYMENT_ENVIRONMENT: external-mvp
  NODE_ENV: production

jobs:
  external-mvp-readiness:
    name: external MVP deployment readiness
    runs-on: ubuntu-latest
    environment: external-mvp
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opportunity_os_migration_check
          POSTGRES_USER: opportunity_os
          POSTGRES_PASSWORD: migration-check-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opportunity_os -d opportunity_os_migration_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify clean-database migrations
        env:
          MIGRATION_CLEAN_DATABASE_URL: postgresql://opportunity_os:migration-check-only@127.0.0.1:5432/opportunity_os_migration_check
          MIGRATION_CLEAN_DATABASE_CONFIRMED_EMPTY: "true"
        run: pnpm --filter @opportunity-os/database verify:migrations:clean

      - name: Verify external MVP policy
        run: node scripts/verify-repository.mjs --phase phase-4-milestone-34

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Validate Docker Compose
        run: docker compose config

      - name: Verify hosted release when targets are configured
        env:
          OPPORTUNITY_OS_API_URL: ${{ vars.OPPORTUNITY_OS_API_URL }}
          OPPORTUNITY_OS_WEB_URL: ${{ vars.OPPORTUNITY_OS_WEB_URL }}
          OPPORTUNITY_OS_RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$OPPORTUNITY_OS_API_URL" ] || [ -z "$OPPORTUNITY_OS_WEB_URL" ]; then
            echo "MANUAL ACTION REQUIRED: configure canonical hosted URL variables before release promotion."
            exit 0
          fi
          pnpm verify:hosted-release

      - name: Record deployment workflow contract
        run: |
          echo "deployment workflow: external-mvp"
          echo "production config: .env.example plus protected external-mvp environment secrets"
          echo "secrets management: GitHub external-mvp environment secrets"
          echo "health monitoring: API health endpoint and Docker Compose health checks"
          echo "operational logging: structured secret-safe logs"
          echo "monitoring strategy: health, logs, error rate, latency, resource pressure"
          echo "backup strategy: PostgreSQL snapshot and restore runbook"
          echo "External URL verification: check OPPORTUNITY_OS_WEB_URL and OPPORTUNITY_OS_API_URL after deployment"
