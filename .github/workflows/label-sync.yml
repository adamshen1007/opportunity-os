name: label-sync

on:
  push:
    branches: [main]
    paths:
      - .github/labels.yml
      - .github/workflows/label-sync.yml
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Sync labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");

            const source = fs.readFileSync(".github/labels.yml", "utf8");
            const labels = [];
            let current = null;

            for (const line of source.split(/\r?\n/)) {
              const name = line.match(/^\s*-\s+name:\s*(.+)\s*$/);
              if (name) {
                current = { name: name[1].replace(/^"|"$/g, "") };
                labels.push(current);
                continue;
              }
              if (!current) continue;

              const property = line.match(/^\s+(color|description):\s*(.+)\s*$/);
              if (property) {
                current[property[1]] = property[2].replace(/^"|"$/g, "");
              }
            }

            for (const label of labels) {
              if (!label.name || !label.color || !label.description) {
                core.setFailed(`Invalid label entry: ${JSON.stringify(label)}`);
                return;
              }

              try {
                await github.rest.issues.updateLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
            }

            core.info(`Synced ${labels.length} labels.`);
